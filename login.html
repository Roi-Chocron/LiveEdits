<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות למערכת - LiveEdits</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-2xl shadow-lg mb-3">
                <i class="fa-solid fa-video"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">LiveEdits Hub</h1>
            <p class="text-sm text-gray-500 mt-1">מערכת חכמה לניהול שידורים, סטרימרים ועורכים</p>
        </div>

        <!-- Alert messages -->
        <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-semibold text-center"></div>
        <div id="successMsg" class="hidden mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-semibold text-center"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 mr-1">שם משתמש</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="הזן שם משתמש"
                        class="w-full pr-10 pl-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 mr-1">סיסמה</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pr-10 pl-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer flex items-center justify-center gap-2">
                <span>כניסה למערכת</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>

        <!-- Quick Switch for Demo Users -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <span class="text-xs font-semibold text-gray-400 block text-center mb-3">כניסה מהירה לחשבונות מוגדרים מראש:</span>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fillAndLogin('streamer', 'streamer123')"
                    class="p-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 rounded-xl border border-indigo-200 text-xs font-bold transition flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-broadcast-tower text-indigo-600 text-sm"></i>
                    <span>סטרימר (עודד)</span>
                    <span class="text-[10px] text-indigo-500 font-normal">שליטה ב-OBS</span>
                </button>
                <button onclick="fillAndLogin('editor1', 'editor123')"
                    class="p-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl border border-emerald-200 text-xs font-bold transition flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-scissors text-emerald-600 text-sm"></i>
                    <span>עורך (דניאל)</span>
                    <span class="text-[10px] text-emerald-500 font-normal">צפייה ועריכה</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function fillAndLogin(user, pwd) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pwd;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> מתחבר...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // Redirect according to user role or target URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    if (nextUrl) {
                        window.location.href = nextUrl;
                    } else if (data.user.role === 'streamer') {
                        window.location.href = '/home';
                    } else {
                        window.location.href = '/home';
                    }
                } else {
                    errorDiv.textContent = data.message || 'שם משתמש או סיסמה שגויים';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'שגיאת תקשורת מול השרת: ' + err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>כניסה למערכת</span> <i class="fa-solid fa-arrow-left"></i>';
            }
        }
    </script>
</body>
</html>
