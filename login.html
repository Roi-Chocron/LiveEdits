<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות למערכת - LiveEdits</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Assistant', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 4px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Subtle Background Decoration -->
    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-indigo-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 bg-violet-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

    <!-- -->
    <div class="max-w-md w-full bg-white rounded-[2rem] shadow-card p-8 border border-slate-100 relative z-10">
        
        <!-- Logo / Header -->
        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 mx-auto mb-4">
                <i class="fa-solid fa-video"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">LiveEdits Hub</h1>
            <p class="text-sm text-slate-500 mt-1.5">התחברות למערכת הניהול והשידור</p>
        </div>

        <!-- Alert messages -->
        <div id="errorMsg" class="hidden mb-6 p-3.5 rounded-xl bg-rose-50 border border-rose-100 text-rose-700 text-sm font-semibold text-center flex items-center justify-center gap-2"></div>
        <div id="successMsg" class="hidden mb-6 p-3.5 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 text-sm font-semibold text-center flex items-center justify-center gap-2"></div>

        <!-- -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">שם משתמש</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required placeholder="הזן שם משתמש"
                        class="w-full pr-11 pl-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm outline-none transition-all bg-slate-50 focus:bg-white placeholder-slate-400 font-medium text-slate-800">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-700">סיסמה</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pr-11 pl-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm outline-none transition-all bg-slate-50 focus:bg-white placeholder-slate-400 font-mono text-left dir-ltr">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 cursor-pointer flex items-center justify-center gap-2.5 mt-2">
                <span>כניסה למערכת</span>
                <i class="fa-solid fa-arrow-left text-sm opacity-80"></i>
            </button>
        </form>

        <!-- -->
        <div class="mt-8 pt-6 border-t border-slate-100">
            <span class="text-[10px] font-bold text-slate-400 block text-center mb-4 uppercase tracking-wider">כניסה מהירה לבדיקה</span>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="fillAndLogin('streamer', 'streamer123')"
                    class="group p-3 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 rounded-xl transition-all duration-200 flex flex-col items-center gap-1.5 cursor-pointer shadow-sm">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mb-1 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-broadcast-tower text-sm"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 group-hover:text-indigo-700">סטרימר (עודד)</span>
                    <span class="text-[10px] text-slate-500 font-medium">שליטה ב-OBS</span>
                </button>
                
                <button type="button" onclick="fillAndLogin('editor1', 'editor123')"
                    class="group p-3 bg-white hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 rounded-xl transition-all duration-200 flex flex-col items-center gap-1.5 cursor-pointer shadow-sm">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-1 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-scissors text-sm"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 group-hover:text-emerald-700">עורך (דניאל)</span>
                    <span class="text-[10px] text-slate-500 font-medium">צפייה ועריכה</span>
                </button>
            </div>
        </div>
    </div>

    <!-- -->
    <script>
        function fillAndLogin(user, pwd) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pwd;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>מתחבר...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // Redirect according to user role or target URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    if (nextUrl) {
                        window.location.href = nextUrl;
                    } else if (data.user.role === 'streamer') {
                        window.location.href = '/home';
                    } else {
                        window.location.href = '/home';
                    }
                } else {
                    errorDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${data.message || 'שם משתמש או סיסמה שגויים'}</span>`;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>שגיאת תקשורת מול השרת</span>`;
                errorDiv.classList.remove('hidden');
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>כניסה למערכת</span> <i class="fa-solid fa-arrow-left text-sm opacity-80"></i>';
            }
        }
    </script>
</body>
</html>
