<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממשק ניהול עורכים וקליפים</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f7f9fc;
        }
    </style>
</head>
<body class="min-p-0 m-0 text-gray-800">

    <header class="w-full bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <!-- Right Side: User greeting & avatar -->
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-gray-300 border-2 border-gray-400 overflow-hidden shadow">
                <img src="https://placehold.co/100x100/d1d5db/4b5563?text=" alt="תמונת פרופיל" class="w-full h-full object-cover">
            </div>
            <span class="font-semibold text-lg text-gray-700">שלום עודד</span>
        </div>

        <!-- Left Side: Navigation Links & Actions -->
        <div class="flex items-center gap-3">
            <a href="/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition shadow-inner">
                <i class="fa-solid fa-gamepad ml-1"></i> מעבר ל-Stream Deck
            </a>
            <button onclick="loadRecordings()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition shadow-inner cursor-pointer" title="רענן רשימה">
                <i class="fa-solid fa-rotate text-lg"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex flex-col gap-10">

        <!-- Section 1: Connected Editors (עורכים מחוברים) -->
        <section class="flex flex-col gap-4">
            <div class="border-b-2 border-gray-800 pb-2 flex justify-between items-center">
                <h2 class="text-2xl font-bold tracking-wide">עורכים מחוברים</h2>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6 pt-2">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-full bg-gray-300 shadow-md border border-gray-400"></div>
                    <span class="text-sm font-medium text-gray-600">דניאל</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-full bg-gray-300 shadow-md border border-gray-400"></div>
                    <span class="text-sm font-medium text-gray-600">אבני</span>
                </div>
            </div>
        </section>

        <!-- Section 2: Pending Clips (קליפים בהמתנה - הקלטות OBS חדשות) -->
        <section class="flex flex-col gap-4">
            <div class="border-b-2 border-gray-800 pb-2 flex justify-between items-center">
                <h2 class="text-2xl font-bold tracking-wide">קליפים בהמתנה (הקלטות OBS)</h2>
            </div>

            <div id="pendingClipsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                <!-- Dynamically populated from backend recordings -->
                <div class="text-gray-500 text-sm py-4">טוען הקלטות...</div>
            </div>
        </section>

        <!-- Section 3: Ready Clips (קליפים מוכנים) -->
        <section class="flex flex-col gap-4">
            <div class="border-b-2 border-gray-800 pb-2">
                <h2 class="text-2xl font-bold tracking-wide">קליפים מוכנים</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                <div class="bg-gray-200 rounded-xl shadow-md h-56 flex flex-col justify-between p-4 relative border border-gray-300">
                    <span class="text-xs text-gray-600 font-semibold">14/05/26</span>
                    <div class="flex justify-between items-end">
                        <span class="text-sm font-bold text-gray-700">00:15:00</span>
                        <span class="text-sm font-bold text-gray-700">מוכן</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Video Modal Popup -->
    <div id="videoModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl p-6 relative flex flex-col gap-6 my-16">
            <!-- Close Button -->
            <button onclick="closeVideoModal()" class="absolute -top-12 left-0 md:left-auto md:-left-12 w-10 h-10 rounded-full bg-white bg-opacity-90 hover:bg-white flex items-center justify-center text-gray-800 text-2xl font-bold transition shadow-lg cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Video Player Box with Real HTML5 Video -->
            <div class="w-full h-80 bg-black rounded-xl overflow-hidden border border-gray-300 flex items-center justify-center relative shadow-inner mt-2">
                <video id="modalVideoPlayer" controls class="w-full h-full object-contain">
                    הדפדפן שלך אינו תומך בניגון וידאו.
                </video>
            </div>

            <!-- Details Section -->
            <div class="flex flex-col md:flex-row justify-between gap-6 items-start">
                <div class="flex flex-col gap-3 w-full md:w-auto md:min-w-[160px] order-2 md:order-1">
                    <button id="editVideoBtn" onclick="editVideo()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2.5 px-4 rounded-lg border border-gray-300 shadow-sm transition flex items-center justify-center">
                        <i class="fa-solid fa-scissors ml-2 text-gray-600"></i> עריכת הסרטון
                    </button>
                    <button onclick="publishVideo()" class="w-full bg-white hover:bg-gray-50 text-gray-800 font-semibold py-2.5 px-4 rounded-lg border border-gray-800 shadow-sm transition">
                        פרסום הסרטון
                    </button>
                </div>

                <div class="flex flex-col gap-2 text-right flex-1 order-1 md:order-2 w-full overflow-hidden">
                    <h3 id="modalTitle" class="text-xl font-bold text-gray-800">שם הסרטון</h3>
                    <p id="modalDescription" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words">
                        תיאור הסרטון
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Dynamic Loading & Modal Handling -->
    <script>
        async function loadRecordings() {
            const container = document.getElementById('pendingClipsContainer');
            try {
                const response = await fetch('/api/recordings');
                const recordings = await response.json();

                if (recordings.length === 0) {
                    container.innerHTML = '<div class="text-gray-500 text-sm py-4 col-span-3">אין עדיין הקלטות חדשות. בצע הקלטה דרך ה-Stream Deck!</div>';
                    return;
                }

                container.innerHTML = '';
                // הפיכת סדר התצוגה בצד הלקוח בלבד - החדש ביותר מופיע ראשון
                const displayList = [...recordings].reverse();

                displayList.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-200 rounded-xl shadow-md h-64 flex flex-col justify-between p-3 relative border border-gray-300 hover:shadow-lg transition cursor-pointer overflow-hidden";
                    
                    // Thumbnail image or placeholder
                    const bgStyle = rec.thumbnail ? `background-image: url('${rec.thumbnail}'); background-size: cover; background-position: center;` : 'background-color: #d1d5db;';

                    card.innerHTML = `
                        <div class="w-full h-36 rounded-lg overflow-hidden relative shadow-inner border border-gray-300" style="${bgStyle}">
                            <div class="absolute inset-0 bg-black bg-opacity-20 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                                <div class="w-10 h-10 rounded-full bg-white bg-opacity-90 flex items-center justify-center shadow">
                                    <i class="fa-solid fa-play text-gray-800 ml-0.5"></i>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-between items-start text-xs text-gray-600 font-semibold mt-2">
                            <span>${rec.date_time}</span>
                            <span class="bg-gray-300 px-2 py-0.5 rounded text-[11px]">${rec.button_used}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-sm font-bold text-gray-700">${rec.duration}</span>
                            <span class="text-xs font-semibold text-gray-500 truncate max-w-[150px]">${rec.file_name}</span>
                        </div>
                    `;

                    card.onclick = () => openVideoModal(rec.file_name, `נתיב קובץ מלא:\n${rec.file_path}`, rec.file_path);
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="text-red-500 text-sm py-4 col-span-3">שגיאה בטעינת ההקלטות מהשרת.</div>';
            }
        }

        let currentVideoPath = null;
        let currentVideoName = null;

        function openVideoModal(title, description, filePath) {
            currentVideoPath = filePath;
            currentVideoName = title;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;
            
            const videoPlayer = document.getElementById('modalVideoPlayer');
            videoPlayer.src = `/api/video?path=${encodeURIComponent(filePath)}`;
            videoPlayer.load();

            document.getElementById('videoModal').classList.remove('hidden');
            document.getElementById('videoModal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            const videoPlayer = document.getElementById('modalVideoPlayer');
            videoPlayer.pause();
            videoPlayer.src = '';

            document.getElementById('videoModal').classList.remove('flex');
            document.getElementById('videoModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        async function editVideo() {
            if (!currentVideoPath) {
                alert('לא נבחר סרטון לעריכה. נא ללחוץ על סרטון מתוך הרשימה.');
                return;
            }

            const editBtn = document.getElementById('editVideoBtn');
            const originalHtml = editBtn ? editBtn.innerHTML : 'עריכת הסרטון';
            if (editBtn) {
                editBtn.disabled = true;
                editBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-2"></i> פותח ב-OpenReel...';
            }

            // פותחים טאב באופן סינכרוני כדי למנוע חסימת פופ-אפ על ידי הדפדפן (Chrome Popup Blocker)
            let newTab = null;
            try {
                newTab = window.open('about:blank', '_blank');
                if (newTab) {
                    newTab.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>פותח את OpenReel...</title></head><body style="margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#111827;color:#f3f4f6;font-family:sans-serif;"><div style="font-size:36px;margin-bottom:16px;">🎬</div><div style="font-size:18px;font-weight:600;">פותח את עורך הסרטונים OpenReel...</div><div style="font-size:14px;color:#9ca3af;margin-top:8px;">טוען את הסרטון לעריכה, אנא המתן רגע...</div></body></html>');
                }
            } catch (tabErr) {
                console.warn('Could not pre-open blank tab:', tabErr);
            }

            try {
                const response = await fetch('/api/open-editor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: currentVideoPath,
                        name: currentVideoName
                    })
                });

                const data = await response.json();
                if (data.status === 'success' && data.url) {
                    if (newTab && !newTab.closed) {
                        newTab.location.href = data.url;
                    } else {
                        window.open(data.url, '_blank') || (window.location.href = data.url);
                    }
                } else {
                    if (newTab && !newTab.closed) newTab.close();
                    alert('שגיאה בפתיחת העורך: ' + (data.message || 'שגיאה לא ידועה'));
                }
            } catch (err) {
                console.error('Error opening editor:', err);
                if (newTab && !newTab.closed) newTab.close();
                alert('שגיאה בפנייה לשרת: ' + err.message);
            } finally {
                if (editBtn) {
                    editBtn.disabled = false;
                    editBtn.innerHTML = originalHtml;
                }
            }
        }

        function publishVideo() {
            // Internal logic
        }

        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target === modal) {
                closeVideoModal();
            }
        }

        // Load recordings on page open
        window.onload = loadRecordings;
    </script>
</body>
</html>
