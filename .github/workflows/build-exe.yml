name: Build and Release Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests obsws-python

      - name: Build Standalone Single-File EXE
        run: |
          cd streamer_client
          pyinstaller --noconfirm --onefile --windowed --name "LiveEdits_Streamer_Client" stream_deck_gui.py

      - name: Create GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "LiveEdits Streamer Client Latest"
          files: streamer_client/dist/LiveEdits_Streamer_Client.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
